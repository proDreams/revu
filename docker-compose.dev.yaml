services:
  revu:
    build: .
    container_name: revu
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "8000:8000"
    volumes:
      - ./revu_logs:/code/logs
      - ./config/settings.yaml:/code/config/settings.yaml
