repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^strings/
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer

  # Единый линтер и форматтер: правила (E/W/F/I/UP), длина строки и сортировка
  # импортов задаются в pyproject.toml, чтобы pre-commit и CI совпадали.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
