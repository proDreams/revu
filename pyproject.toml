[project]
name = "revu"
version = "1.5.0"
description = "Self-hosted AI code review for your Pull Requests."
authors = [
    { name = "proDream", email = "sushkoos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dynaconf>=3.2.13",
    "fastapi>=0.136.1",
    "gigachat>=0.2.1",
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "unidiff>=0.7.5",
    "pydantic==2.13.4",
    "yandex-ai-studio-sdk>=0.20.2",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
app = "revu.runner:run"

[project.optional-dependencies]
pytest = [
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80"
]

testpaths = ["tests"]
markers = [
    "unit: Unit tests for domain logic",
    "integration: Integration tests for application layer",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
