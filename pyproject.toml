[project]
name = "revu"
version = "2.4.2"
description = "Self-hosted AI code review for your Pull Requests."
authors = [
    { name = "proDream", email = "sushkoos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dynaconf>=3.3.5",
    "fastapi>=0.143.0",
    "gigachat>=0.2.3",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "unidiff>=1.0.1",
    "pydantic==2.14.1",
    "yandex-ai-studio-sdk>=0.22.1",
    "uvicorn>=0.54.0",
    "dishka>=1.10.1",
    # One wheel per grammar instead of the aggregated `tree-sitter-language-pack`:
    # the pack downloads grammars at runtime into a cache directory, which breaks
    # in closed networks and makes the container write state on the first parse.
    # The grammar wheels are built against 0.25: a 0.26 core mismatches their ABI,
    # and the tree walk then segfaults on poisoned memory.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-c-sharp",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-dart",
    "tree-sitter-dockerfile",
    "tree-sitter-elixir",
    "tree-sitter-go",
    "tree-sitter-haskell",
    "tree-sitter-hcl",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-ocaml",
    "tree-sitter-perl",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
    "mypy>=1.20,<2",
]

[build-system]
# Ships inside uv, so this range and the `uv` tag in the Dockerfile move together.
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project.scripts]
app = "revu.runner:run"
revu = "revu.presentation.cli.main:main"

[project.optional-dependencies]
pytest = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80"
]

testpaths = ["tests"]
markers = [
    "unit: Unit tests for domain logic",
    "integration: Integration tests for application layer",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
