[project]
name = "revu"
version = "2.0.0"
description = "Self-hosted AI code review for your Pull Requests."
authors = [
    { name = "proDream", email = "sushkoos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dynaconf>=3.3.5",
    "fastapi>=0.143.0",
    "gigachat>=0.2.3",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "unidiff>=1.0.1",
    "pydantic==2.14.1",
    "yandex-ai-studio-sdk>=0.22.1",
    "uvicorn>=0.54.0",
    "dishka>=1.10.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
    # Kept in step with the mirrors-mypy rev in .pre-commit-config.yaml: the hook
    # checks the whole tree without project dependencies, while `uv run mypy src`
    # checks the dependency boundaries too (see the CI workflow).
    "mypy>=1.20,<2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
app = "revu.runner:run"

[project.optional-dependencies]
pytest = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# E/W/F перекрывают то, что раньше давали flake8 и autopep8, I — isort,
# UP — pyupgrade. E501 выключен: длинные строки — это промпты на русском,
# ломать их конкатенацией нельзя, всё остальное держит ruff-format.
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
# Хук mirrors-mypy выполняется в изолированном окружении без зависимостей
# проекта и сам передаёт --ignore-missing-imports, поэтому настройка закреплена
# и здесь: поведение гейта должно быть воспроизводимым и при ручном запуске.
# Полноценная проверка границ с fastapi/pydantic/openai требует запуска из venv
# проекта: uv run --with mypy mypy src
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80"
]

testpaths = ["tests"]
markers = [
    "unit: Unit tests for domain logic",
    "integration: Integration tests for application layer",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
