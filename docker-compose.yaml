services:
  revu:
    image: ghcr.io/prodreams/revu:latest
    container_name: revu
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - ./revu_logs:/code/logs
      - ./settings.yaml:/code/config/settings.yaml
