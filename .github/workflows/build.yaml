# Build and Release: one workflow, two kinds of push, and no work done twice.
#
# A push to `main` lints, tests and publishes the image (`:<version>` and `:latest`),
# which is what keeps `docker compose pull` working between releases.
#
# A version tag lints and tests the same commit and then releases: the guards below,
# a GitHub Release whose body is the changelog section, and — deliberately — no
# second image build. The image for that version was published by the push to `main`
# that preceded the tag, and this path verifies that it exists instead of rebuilding
# it, so pushing a tag neither waits for nor duplicates a build. The manual run is
# the recovery path and does build: it is what to use when the tag went up before
# this workflow reached the default branch, or when a release failed partway.
#
# Why the guards. A release should be unable to exist without a changelog entry, and
# a tag should be unable to disagree with pyproject.toml. `uv sync --frozen` is a
# third guard in practice: a version bumped in pyproject.toml but not in uv.lock
# fails the install before anything is built.
#
# Both tag spellings are accepted — `2.4.0`, which is this repository's convention
# (1.0.0 through 1.5.0), and `v2.4.0`, which is the more common one elsewhere — and
# the version is compared with the `v` stripped. A tag push that carries the workflow
# file itself can be missed: GitHub evaluates the tag trigger against the workflows
# already present on the default branch. When that happens, re-push the tag (delete
# it on the remote and push it again) or use the manual run.

name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*" # this repository's convention: 2.4.0
      - "v[0-9]*" # and the other one: v2.4.0
  # Release the version currently in pyproject.toml, building the image as it goes.
  # Use it when a tag push was missed, or to re-run a release that failed partway.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image

jobs:
  lint:
    env:
      CACHE_DIR: ~/.cache
      PRE_COMMIT_HOME: ~/.cache/pre-commit
      UV_CACHE_DIR: ~/.cache/uv

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache uv cache-dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache pre-commit hooks
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-cache-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-cache-

      - id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: 3.13
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --all-extras --frozen
          uv run pre-commit install

      - name: Lint pre-commit
        # No `--hook-stage manual`: no hook in this repository declares that stage,
        # so passing it ran nothing at all.
        run: uv run pre-commit run --all-files

      - name: Type check with project dependencies
        # pre-commit runs mypy in an isolated env without the dependencies, so it
        # cannot see errors at the fastapi/pydantic/openai boundary. This step can.
        run: uv run mypy src

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: lint"

  test:
    env:
      UV_CACHE_DIR: ~/.cache/uv

    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache uv cache-dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: 3.13
          enable-cache: false

      - name: Install dependencies
        # `--frozen`: a version bumped in pyproject.toml but not in uv.lock fails here.
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: tests"

  version:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      # Whether the image is built here: yes on a branch push and on a manual run,
      # no on a tag push, where the main push before the tag already built it.
      build: ${{ steps.resolve.outputs.build }}
      # Whether a GitHub Release is created: on a tag push and on a manual run.
      release: ${{ steps.resolve.outputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve the version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"

          if [ "$REF_TYPE" = "tag" ]; then
            # Release the tag that was pushed rather than a name rebuilt from the
            # version: both spellings are accepted, and the release has to point at
            # the tag that exists. Only the version is compared.
            tag="$REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag ${tag} does not match the version ${version} in pyproject.toml"
              exit 1
            fi
            echo "Tag ${tag} matches pyproject.toml; the image was built by the push to main"
            build=false
            release=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Nothing was tagged, so the release creates the tag this repository uses.
            tag="${version}"
            echo "Manual run: releasing ${tag} from pyproject.toml, image included"
            build=true
            release=true
          else
            # A push to main: publish the image, release nothing.
            tag="${version}"
            echo "Push to ${REF_NAME}: publishing ${version}"
            build=true
            release=false
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build=${build}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  image:
    needs:
      - test
      - version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the released image exists
        if: needs.version.outputs.build == 'false'
        # The tag path does not rebuild: this is what keeps a release from pointing
        # at an image nobody published.
        run: |
          image="ghcr.io/prodreams/revu:${{ needs.version.outputs.version }}"
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image does not exist. Push this commit to main first, or run this workflow manually, which builds the image itself."
            exit 1
          fi
          echo "$image was published by the push to main that preceded this tag"

      - name: Build and push Docker image
        if: needs.version.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=registry,ref=ghcr.io/prodreams/revu:latest
          cache-to: type=inline
          # Which commit the image came from, readable without pulling it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/prodreams/revu:${{ needs.version.outputs.version }}
            ghcr.io/prodreams/revu:latest

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: image"

  release:
    needs:
      - version
      - image
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # `index(...) == 1` rather than a regex: the heading carries brackets, and
          # matching a prefix is both simpler and exact.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { if (!started && $0 == "") next; started = 1; print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          echo '--- release notes ---'
          cat release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          # A version with a hyphen is a pre-release candidate, by SemVer's own rule.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: release"
