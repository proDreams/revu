name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*" # this repository's convention: 2.4.0
      - "v[0-9]*" # and the other one: v2.4.0
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  lint:
    env:
      CACHE_DIR: ~/.cache
      PRE_COMMIT_HOME: ~/.cache/pre-commit
      UV_CACHE_DIR: ~/.cache/uv

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache uv cache-dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache pre-commit hooks
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-cache-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-cache-

      - id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: 3.13
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --all-extras --frozen
          uv run pre-commit install

      - name: Lint pre-commit
        run: uv run pre-commit run --all-files

      - name: Type check with project dependencies
        run: uv run mypy src

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: lint"

  test:
    env:
      UV_CACHE_DIR: ~/.cache/uv

    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache uv cache-dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: 3.13
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: tests"

  version:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
      release: ${{ steps.resolve.outputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve the version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"

          if [ "$REF_TYPE" = "tag" ]; then
            # Release the tag that was pushed rather than a name rebuilt from the
            # version: both spellings are accepted, and the release has to point at
            # the tag that exists. Only the version is compared.
            tag="$REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag ${tag} does not match the version ${version} in pyproject.toml"
              exit 1
            fi
            echo "Tag ${tag} matches pyproject.toml; the image was built by the push to main"
            build=false
            release=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Nothing was tagged, so the release creates the tag this repository uses.
            tag="${version}"
            echo "Manual run: releasing ${tag} from pyproject.toml, image included"
            build=true
            release=true
          else
            # A push to main: publish the image, release nothing.
            tag="${version}"
            echo "Push to ${REF_NAME}: publishing ${version}"
            build=true
            release=false
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build=${build}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  image:
    needs:
      - test
      - version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the released image exists
        if: needs.version.outputs.build == 'false'
        run: |
          image="ghcr.io/prodreams/revu:${{ needs.version.outputs.version }}"
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image does not exist. Push this commit to main first, or run this workflow manually, which builds the image itself."
            exit 1
          fi
          echo "$image was published by the push to main that preceded this tag"

      - name: Build and push Docker image
        if: needs.version.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=registry,ref=ghcr.io/prodreams/revu:latest
          cache-to: type=inline
          # Which commit the image came from, readable without pulling it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/prodreams/revu:${{ needs.version.outputs.version }}
            ghcr.io/prodreams/revu:latest

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: image"

  release:
    needs:
      - version
      - image
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # `index(...) == 1` rather than a regex: the heading carries brackets, and
          # matching a prefix is both simpler and exact.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { if (!started && $0 == "") next; started = 1; print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          echo '--- release notes ---'
          cat release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: release"
