# Release: cut a version tag, get a GitHub Release whose notes are the changelog,
# and an image that is exactly the commit the tag points at.
#
# Triggered by a version tag or manually from the Actions tab. Both spellings are
# accepted — `2.4.0` and `v2.4.0` — because this repository's tags (1.0.0 through
# 1.5.0) carry no `v`, while a `v` is the more common convention elsewhere; the
# trigger lists both and the version is compared with the `v` stripped. Two guards
# run before anything is built or published:
#   * on a tag push the tag must equal `version` in pyproject.toml;
#   * CHANGELOG.md must carry a `## [<version>]` section, which becomes the Release
#     body. The changelog therefore stays the single source of release notes, and a
#     release cannot be cut without one.
# `uv sync --frozen` is a third guard in practice: a version bumped in pyproject.toml
# but not in uv.lock fails the install before anything is built.
#
# A tag push that carries the workflow file itself can be missed: GitHub evaluates the
# tag trigger against the workflows already present on the default branch. When that
# happens, re-push the tag (delete it on the remote and push it again) or use the
# manual run, which releases the version currently in pyproject.toml.
#
# Why the image is built again here, although build.yaml already pushes one for every
# push to main: the version tag an image carries comes from pyproject.toml, so the
# image built from main is the version main happened to hold. Building from the tagged
# commit makes a released version mean that commit, and the tag guard means the two
# cannot disagree.
#
# The image is single-architecture, like the one build.yaml pushes. Both grammars and
# the base image are available for arm64, so adding `platforms: linux/amd64,linux/arm64`
# to the build step is a self-contained change — it doubles the build time, which is
# why it is not done here.

name: Release

on:
  push:
    tags:
      - "[0-9]*" # this repository's convention: 2.4.0
      - "v[0-9]*" # and the other one: v2.4.0
  # Manual recovery path: releases the version currently in pyproject.toml from the
  # default branch. Use it when a tag push went up together with this workflow file,
  # or to re-run a release that failed partway.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: ~/.cache/uv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve the version
        id: version
        run: |
          version="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Nothing was tagged, so the release creates the tag this repository uses.
            tag="${version}"
            echo "Manual run: releasing ${tag} from pyproject.toml"
          else
            # Release the tag that was pushed rather than a name rebuilt from the
            # version: `2.4.0` and `v2.4.0` are both accepted, and the release has to
            # point at the one that exists. Only the version is compared.
            tag="${GITHUB_REF_NAME}"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag ${tag} does not match the version ${version} in pyproject.toml"
              exit 1
            fi
            echo "Tag ${tag} matches pyproject.toml"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `index(...) == 1` rather than a regex: the heading carries brackets, and
          # matching a prefix is both simpler and exact.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { if (!started && $0 == "") next; started = 1; print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          echo '--- release notes ---'
          cat release-notes.md

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: 3.13
          enable-cache: false

      - name: Install dependencies
        # `--frozen`: a version bumped in pyproject.toml but not in uv.lock fails here.
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=registry,ref=ghcr.io/prodreams/revu:latest
          cache-to: type=inline
          tags: |
            ghcr.io/prodreams/revu:${{ steps.version.outputs.version }}
            ghcr.io/prodreams/revu:latest

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          # A version with a hyphen is a pre-release candidate, by SemVer's own rule.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Telegram Notify Action
        uses: proDreams/actions-telegram-notifier@main
        if: always()
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          status: ${{ job.status }}
          notify_fields: "actor,repository,branch,commit"
          message: "Job: Release"
